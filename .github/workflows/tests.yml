name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run tests
        run: node --test
      - name: Build example site
        run: node bin/marklite.js build --src example/content --layouts example/layouts --out example/dist
      - name: Check output
        shell: bash
        run: |
          test -f example/dist/index.html
          test -f example/dist/hello-markdown.html
          grep -q "marklite" example/dist/index.html
