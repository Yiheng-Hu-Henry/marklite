<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · {{site.title}}</title>
<meta name="description" content="{{excerpt}}">
<style>
  :root { --ink: #1b1d22; --muted: #6b7280; --line: #e6e4df; --bg: #fdfcfa; --accent: #1f6f5c; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.75 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .site-head {
    display: flex; align-items: baseline; gap: 14px;
    padding: 28px 24px 14px; max-width: 720px; margin: 0 auto;
    border-bottom: 1px solid var(--line);
  }
  .brand { font-size: 18px; font-weight: 600; color: var(--ink); text-decoration: none; letter-spacing: -0.2px; }
  .desc { color: var(--muted); font-size: 13px; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 24px 80px; }
  article h1 {
    font-size: 30px; line-height: 1.3; margin: 0 0 10px; letter-spacing: -0.4px;
  }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 34px; }
  .content h2 { font-size: 21px; margin: 38px 0 12px; }
  .content h3 { font-size: 17px; margin: 28px 0 10px; }
  .content p { margin: 0 0 18px; }
  .content a { color: var(--accent); text-underline-offset: 3px; }
  .content ul, .content ol { padding-left: 22px; margin: 0 0 18px; }
  .content li { margin: 6px 0; }
  .content blockquote {
    margin: 22px 0; padding: 2px 0 2px 18px;
    border-left: 3px solid var(--line); color: #4b5058;
  }
  .content pre {
    background: #1f2430; color: #e6e9ef; padding: 16px 18px;
    border-radius: 10px; overflow-x: auto; font-size: 13.5px; line-height: 1.6;
  }
  .content code { font-family: ui-monospace, Consolas, monospace; font-size: 0.92em; }
  .content :not(pre) > code {
    background: #efeee9; padding: 2px 5px; border-radius: 4px;
  }
  .content table { border-collapse: collapse; width: 100%; margin: 0 0 20px; font-size: 14.5px; }
  .content th, .content td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; }
  .content th { background: #f4f2ee; font-weight: 600; }
  .content img { max-width: 100%; border-radius: 8px; }
  .content hr { border: none; border-top: 1px solid var(--line); margin: 34px 0; }
  .tags { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    font-size: 12px; color: var(--accent); background: #eaf3f0;
    padding: 2px 9px; border-radius: 999px;
  }
  footer { max-width: 720px; margin: 0 auto; padding: 22px 24px 60px; color: var(--muted); font-size: 12.5px; }
  li.task { list-style: none; margin-left: -22px; }
</style>
</head>
<body>
<header class="site-head">
  <a class="brand" href="./index.html">{{site.title}}</a>
  <span class="desc">{{site.description}}</span>
</header>
<main>
  <article>
    <h1>{{title}}</h1>
    <div class="meta">{{date}} · {{readingTime}}</div>
    <div class="content">{{content}}</div>
    <div class="tags">{{tags}}</div>
  </article>
</main>
<footer>© {{year}} {{site.author}}</footer>
</body>
</html>
