<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{site.title}}</title>
<meta name="description" content="{{site.description}}">
<style>
  :root { --ink: #1b1d22; --muted: #6b7280; --line: #e6e4df; --bg: #fdfcfa; --accent: #1f6f5c; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.75 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .site-head {
    display: flex; align-items: baseline; gap: 14px;
    padding: 28px 24px 14px; max-width: 720px; margin: 0 auto;
    border-bottom: 1px solid var(--line);
  }
  .brand { font-size: 18px; font-weight: 600; letter-spacing: -0.2px; }
  .desc { color: var(--muted); font-size: 13px; }
  main { max-width: 720px; margin: 0 auto; padding: 34px 24px 60px; }
  .count { color: var(--muted); font-size: 12.5px; margin-bottom: 8px; letter-spacing: .3px; }
  .post { padding: 22px 0; border-bottom: 1px solid var(--line); }
  .post:last-child { border-bottom: none; }
  .post-title { font-size: 20px; font-weight: 600; color: var(--ink); text-decoration: none; letter-spacing: -0.2px; }
  .post-title:hover { color: var(--accent); }
  .post-meta { color: var(--muted); font-size: 12.5px; margin: 6px 0 8px; }
  .post-excerpt { margin: 0 0 10px; color: #3f444b; font-size: 14.5px; }
  .drop { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 11.5px; color: var(--accent); background: #eaf3f0; padding: 2px 9px; border-radius: 999px; }
  footer { max-width: 720px; margin: 0 auto; padding: 22px 24px 60px; color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<header class="site-head">
  <span class="brand">{{site.title}}</span>
  <span class="desc">{{site.description}}</span>
</header>
<main>
  <div class="count">共 {{count}} 篇</div>
  {{content}}
</main>
<footer>© {{year}} {{site.author}} · 由 marklite 生成</footer>
</body>
</html>
